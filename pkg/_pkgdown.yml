# Site pkgdown du paquet tutotypst.
#
# Le HTML est généré dans `package/` à la racine du repo (hors pkg/), puis publié
# par le site Quarto via `resources: package/**` (cf. _quarto.yml). Il est servi
# sous le sous-chemin `/package` du site du tutoriel.
#
# `url` DOIT inclure ce sous-chemin : pkgdown génère alors des liens absolus
# (navbar, page 404, recherche) qui restent corrects une fois le site servi sous
# /package. L'ID de contenu vient de `_publish.yml`. Si l'URL de déploiement
# change, mettez-la à jour À DEUX ENDROITS : ici ET dans le champ `URL:` de
# `pkg/DESCRIPTION` (sinon pkgdown signale « URLs not ok »), puis relancez
# `just pkg-site`.
url: https://connect.posit.cloud/cderv/content/019df82c-7202-2165-28ea-7f9ca734ad26/package

destination: ../package

template:
  bootstrap: 5
  light-switch: true

lang: fr

navbar:
  structure:
    left: [reference]
    right: [search, github]

reference:
- title: Vérification & installation
  desc: >
    Préparer et contrôler son environnement avant le tutoriel.
  contents:
  - verifier_installation
  - par_ou_commencer
- title: Pendant l'exercice
  desc: >
    Installer, réinitialiser et s'orienter dans les exercices.
  contents:
  - installer_exercices
  - reinitialiser_exercice
  - ouvrir_exercices
  - lister_exercices
- title: Polices & charte
  desc: >
    Mode hors-ligne, contournement font-paths et validation de `_brand.yml`.
  contents:
  - basculer_offline
  - appliquer_polices_locales
  - valider_brand
  - polices_typst
- title: Dépannage
  desc: >
    Décoder les erreurs et inspecter la chaîne Typst.
  contents:
  - diagnostiquer_rendu
  - diagnostic_typst
  - inspecter_typ
  - nettoyer_cache
