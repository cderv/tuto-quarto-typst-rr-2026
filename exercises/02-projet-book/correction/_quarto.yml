project:
  type: book

lang: fr

book:
  title: "Anatomie d'une saga"
  subtitle: "Portrait statistique des personnages de Star Wars"
  author: "Mon Mothma"
  date: "2026-06-16"
  chapters:
    - index.qmd
    - 01-anatomie.qmd
    - 02-origines.qmd
    - conclusion.qmd
  appendices:
    - annexe-donnees.qmd

format:
  typst:
    # Workaround Quarto book : les polices téléchargées par _brand.yml
    # (.quarto/typst/fonts/) ne sont pas passées automatiquement à
    # typst en mode book. À retirer quand le bug upstream est fixé.
    font-paths:
      - .quarto/typst/fonts
    # Logo personnalisé : sans cette section, Quarto place le logo
    # `_brand.yml` à 1.5in width / 0.75in padding par défaut, ce qui
    # chevauche les titres dès la 2e page.
    logo:
      path: sw-star
      location: left-top
      width: 0.6in
      padding: 0.4in

execute:
  echo: false
  warning: false
  message: false
