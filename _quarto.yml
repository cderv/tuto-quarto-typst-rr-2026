project:
  type: website
  resources:
    - "exercises/**"
    - "_charte/charte-starwars.pdf"
    # Site pkgdown du paquet R (généré par `just pkg-site` dans `package/`),
    # publié sous /package/. Cf. pkg/_pkgdown.yml.
    - "package/**"

website:
  title: "PDF sans frictions : Typst dans vos projets Quarto"
  description: "Tutoriel Quarto+Typst de 2h aux Rencontres R 2026 — PDF sans frictions"
  page-navigation: true

  open-graph: true
  twitter-card:
    creator: "@chrisderv"

  repo-url: https://github.com/cderv/tuto-quarto-typst-rr-2026
  repo-actions: [edit, issue]

  sidebar:
    background: "#FDC538"
    align: center
    tools:
      - icon: github
        href: https://github.com/cderv/tuto-quarto-typst-rr-2026
        text: "Dépôt GitHub"
    style: docked
    search: true
    collapse-level: 2

  page-footer:
    left: "&copy; CC BY 4.0 · Christophe Dervieux & Maëlle Salmon · Rencontres R 2026"
    right: "Site construit avec [Quarto](https://quarto.org/)."
    background: "#FDC538"

lang: fr
author: "Christophe Dervieux & Maëlle Salmon"
date: "2026-06-16"

format:
  html:
    theme: flatly
    toc: true
    code-copy: true
    code-overflow: wrap
    mainfont: "Atkinson Hyperlegible"
  clean-revealjs:
    preview-links: auto
    theme: [default, reveal-style.scss]
    transition: fade
    chalkboard: true
    footer: "[🔗 cderv.github.io/tuto-quarto-typst-rr-2026](https://cderv.github.io/tuto-quarto-typst-rr-2026)"

execute:
  freeze: auto

profile:
  group:
    - [tuto, pretuto]
