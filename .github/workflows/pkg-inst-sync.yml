name: pkg-inst-sync

# Garde-fou anti-désynchronisation : pkg/inst/exercices/ est une COPIE générée
# de exercises/. Ce job régénère la copie et échoue si elle diffère de ce qui
# est committé (il faut alors lancer `just pkg-sync` puis committer).

on:
  pull_request:
    paths:
      - "exercises/**"
      - "pkg/inst/exercices/**"
      - "pkg/inst/templates/**"
      - "pkg/inst/offline/**"
      - "pkg/data-raw/sync-exercices.R"
  push:
    branches: [main]
    paths:
      - "exercises/**"
      - "pkg/inst/exercices/**"
      - "pkg/inst/templates/**"
      - "pkg/inst/offline/**"
      - "pkg/data-raw/sync-exercices.R"

permissions:
  contents: read

jobs:
  check-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Régénérer pkg/inst depuis exercises/
        run: Rscript pkg/data-raw/sync-exercices.R

      - name: Vérifier que pkg/inst est à jour
        run: |
          cibles="pkg/inst/exercices pkg/inst/templates pkg/inst/offline"
          if [ -n "$(git status --porcelain $cibles)" ]; then
            echo "::error::pkg/inst n'est pas synchronisé avec exercises/. Lancez 'just pkg-sync' puis committez."
            git --no-pager diff -- $cibles
            exit 1
          fi
          echo "pkg/inst est synchronisé."
