name: pkg-inst-sync

# Garde-fou anti-désynchronisation : pkg/inst/exercices/ est une COPIE générée
# de exercises/. Ce job régénère la copie et échoue si elle diffère de ce qui
# est committé (il faut alors lancer `just pkg-sync` puis committer).

on:
  pull_request:
    paths:
      - "exercises/**"
      - "pkg/inst/exercices/**"
      - "pkg/inst/templates/**"
      - "pkg/inst/offline/**"
      - "pkg/data-raw/sync-exercices.R"
  push:
    branches: [main]
    paths:
      - "exercises/**"
      - "pkg/inst/exercices/**"
      - "pkg/inst/templates/**"
      - "pkg/inst/offline/**"
      - "pkg/data-raw/sync-exercices.R"

permissions:
  contents: read

jobs:
  check-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      # Même commande qu'en local (`just pkg-sync-check`) : régénère pkg/inst/
      # puis échoue si le résultat diffère de ce qui est committé. Source unique
      # de la logique = le script R (pas besoin d'installer `just` sur le runner).
      - name: Vérifier que pkg/inst est à jour
        run: Rscript pkg/data-raw/sync-exercices.R --check
